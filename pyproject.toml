[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-downloader"
version = "1.0.0"
description = "Herramienta para descargar manga desde múltiples sitios y generar CBR"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "lxml>=4.9.3",
    "selenium>=4.15.0",
    "tqdm>=4.66.0",
    "Pillow>=10.0.0",
    "PySide6>=6.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
manga-downloader-gui = "manga_downloader.gui.main_gui:main"

[tool.basedpyright]
reportMissingImports = false
